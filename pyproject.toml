[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "data-anonymization-toolkit"
version = "0.1.0"
description = "Config-driven anonymization, synthetic data generation, and privacy validation for tabular datasets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas>=1.3.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyyaml",
]

[project.optional-dependencies]
synthetic = ["sdv>=1.17"]
reporting = ["reportlab"]
all = ["sdv>=1.17", "reportlab", "statsmodels"]

[project.scripts]
anonymize-data = "scripts.anonymize_data:main"
